<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIC TAC TOE</title>
  <link rel="stylesheet" href="index.css" />
</head>

<body>
  <div class="score-buttons">
    <button class="player player0">
      <span class="mark mark-x">❌</span>
      <span class="player0-score">0</span>
    </button>
    <button class="player player1">
      <span class="mark mark-o">⭕</span>
      <span class="player1-score">0</span>
    </button>
  </div>
  <section class="board">
    <div class="mode">
      <button class="mode-friend">
        with friend
      </button>
      <button class="mode-bot">
        VS bot
      </button>
    </div>
    <div class="board-ground">
      <div id="0" class="cube cube0"></div>
      <div id="1" class="cube cube1"></div>
      <div id="2" class="cube cube2"></div>
      <div id="3" class="cube cube3"></div>
      <div id="4" class="cube cube4"></div>
      <div id="5" class="cube cube5"></div>
      <div id="6" class="cube cube6"></div>
      <div id="7" class="cube cube7"></div>
      <div id="8" class="cube cube8"></div>
    </div>
  </section>
  <button class="replay">replay ↺</button>
  <script src="index.js"></script>
</body>

</html>
