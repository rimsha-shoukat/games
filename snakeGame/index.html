<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <h1>SNAKE</h1>
        <section>
            <div>
                <p>Score</p>
                <h1 class="score">00</h1>
            </div>
            <div>
                <p>Best</p>
                <h1 class="top-score">00</h1>
            </div>
        </section>
    </nav>
    <main>
        <!-- game over - replay section -->
        <div class="game-over">
            <h1>GAME OVER</h1>
            <span>
                <h3>SCORE:</h3>
                <h3 class="score">00</h3>
            </span>
            <button class="restart-game">restart game</button>
        </div>
        <section class="ground">
            <!-- play ground will goes here -->
        </section>
    </main>
    <footer>
        <!-- initial -->
        <section class="initial-stage">
            <div>
                <button onclick="changeLevel('easy')">Easy</button>
                <button onclick="changeLevel('medium')">Medium</button>
                <button onclick="changeLevel('hard')">Advance</button>
            </div>
            <button class="start-game">Start</button>
        </section>
        <!-- playing -->
        <section class="playing-stage">
            <div>
                <button class="game-state">Medium</button>
                <button class="pause-game">Pause</button>
            </div>
            <div>
                <button class="left">
                    <svg width="20" height="20" viewBox="0 0 20 20">
                        <polygon fill="#c8c8e8" stroke="#c8c8e8" stroke-width="3" stroke-linejoin="round"
                            points="18,2 2,10 18,17" />
                    </svg>
                </button>
                <button class="up">
                    <svg width="20" height="20" viewBox="0 0 20 20">
                        <polygon fill="#c8c8e8" stroke="#c8c8e8" stroke-width="3" stroke-linejoin="round"
                            points="2,18 10,2 17,18" />
                    </svg>
                </button>
                <button class="down">
                    <svg width="20" height="20" viewBox="0 0 20 20">
                        <polygon fill="#c8c8e8" stroke="#c8c8e8" stroke-width="3" stroke-linejoin="round"
                            points="2,2 10,18 18,2" />
                    </svg>
                </button>
                <button class="right">
                    <svg width="20" height="20" viewBox="0 0 20 20">
                        <polygon fill="#c8c8e8" stroke="#c8c8e8" stroke-width="3" stroke-linejoin="round"
                            points="2,2 18,10 2,17" />
                    </svg>
                </button>
            </div>
        </section>
    </footer>
    <script src="index.js"></script>
</body>

</html>
