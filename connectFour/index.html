<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectFour</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="container">

        <h1 class="title">Connect<span>Four</span></h1>

        <div class="scoreboard">
            <div class="score-card player-one-card">
                <div class="score-indicator"></div>
                <p class="player-label">Player 1</p>
                <p class="score-value" id="score1">0</p>
            </div>
            <div class="vs-block">
                <span class="vs-text">VS</span>
                <span class="round-label">Round <span id="roundNum">1</span></span>
            </div>
            <div class="score-card player-two-card">
                <div class="score-indicator"></div>
                <p class="player-label">Player 2</p>
                <p class="score-value" id="score2">0</p>
            </div>
        </div>

        <div class="status-bar">
            <div class="status-dot" id="statusDot"></div>
            <h2 class="status-text" id="statusText">Player 1's Turn</h2>
        </div>

        <div class="board-wrapper">
            <div class="drop-arrows" id="dropArrows">
                <button onclick="drop(0)">▾</button>
                <button onclick="drop(1)">▾</button>
                <button onclick="drop(2)">▾</button>
                <button onclick="drop(3)">▾</button>
                <button onclick="drop(4)">▾</button>
                <button onclick="drop(5)">▾</button>
                <button onclick="drop(6)">▾</button>
            </div>
            <div class="board-frame">
                <section class="playground" id="playground"></section>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="resetGame()">New Game</button>
            <button class="btn btn-secondary" onclick="resetScores()">Reset Score</button>
        </div>

    </section>

    <script src="index.js"></script>
</body>
</html>
